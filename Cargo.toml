[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wtm_core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
dirs = "6"
ureq = "3"

[profile.release]
strip = true
lto = "thin"
